name: Model D Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-model-d:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Vercel Model D Endpoint
        env:
          MODEL_D_CRON_URL: ${{ vars.MODEL_D_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MODEL_D_CRON_URL" ]; then
            echo "Error: MODEL_D_CRON_URL repository variable is not set."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET repository secret is not set."
            exit 1
          fi

          echo "Starting Model D cron request to $MODEL_D_CRON_URL..."
          
          # We use curl with -w to get the status code, -s to silence progress, 
          # -o to output response body to a file.
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X GET "$MODEL_D_CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          
          echo "HTTP Status: $HTTP_STATUS"
          
          # Print the response safely (it shouldn't contain secrets, just paper trading stats)
          if [ -f response.json ]; then
            echo "Response Body:"
            cat response.json
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Endpoint returned non-200 HTTP status code: $HTTP_STATUS"
            exit 1
          fi
          
          echo "Model D execution completed successfully."
